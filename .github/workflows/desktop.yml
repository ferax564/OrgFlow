name: Desktop binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main or a tag: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  # Decide whether this run publishes a release. A pushed v* tag releases that
  # tag. On main, a package.json version with no matching tag yet releases
  # automatically, so merging a version bump is the whole release procedure.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      stable: ${{ steps.plan.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan release
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; this main build does not release."
            else
              release=true
            fi
          fi
          stable=$([[ "$version" == *-* ]] && echo false || echo true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Release plan: tag=$tag release=$release stable=$stable"
  desktop:
    needs: [quality, version]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            artifact: |
              dist/OrgFlow-*-windows*.exe
              dist/*.blockmap
              dist/latest.yml
              dist/rc.yml
          - name: mac
            os: macos-latest
            script: dist:mac
            artifact: |
              dist/OrgFlow-*-mac.zip
              dist/*.blockmap
              dist/latest-mac.yml
              dist/rc-mac.yml
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            artifact: |
              dist/OrgFlow-*-linux.AppImage
              dist/*.blockmap
              dist/latest-linux.yml
              dist/rc-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Desktop lifecycle test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop lifecycle test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      # Sign whenever this platform's credentials are configured. Without them
      # the build ships unsigned (SmartScreen/Gatekeeper warn on first open);
      # half-configured credentials fail a release rather than silently
      # downgrading it. Other runs (e.g. fork PRs, where GitHub withholds
      # secrets but not variables) just build unsigned.
      - name: Detect signing credentials
        id: signing
        shell: bash
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          MAC_SIGN: ${{ secrets.CSC_LINK }}
          WIN_SIGN: ${{ secrets.WIN_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS) required=(MAC_SIGN APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID) ;;
            Windows) required=(WIN_SIGN WIN_PUBLISHER_NAME) ;;
            *) required=() ;;
          esac
          present=0
          for name in "${required[@]}"; do if [ -n "${!name:-}" ]; then present=$((present+1)); fi; done
          if [ ${#required[@]} -gt 0 ] && [ "$present" -eq ${#required[@]} ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"; echo "Signing credentials found: building signed."
          elif [ "$present" -gt 0 ] && [ "$RELEASE" = true ]; then
            echo "::error::Signing credentials are only partly configured (${present}/${#required[@]}): ${required[*]}"; exit 1
          elif [ "$present" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::warning::Signing credentials are only partly available (${present}/${#required[@]}); building unsigned because this run does not release."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::No signing credentials for ${{ runner.os }}: this build is unsigned."
          fi
      - name: Build app and update metadata
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing Actions secrets expand to empty strings. electron-builder
          # treats an empty CSC_LINK as a certificate path, not as unsigned.
          for signing_var in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var}" ]; then unset "$signing_var"; fi
          done
          if [ "${{ runner.os }}" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }}
      - name: Verify shipped signatures and notarization
        if: steps.signing.outputs.configured == 'true' && needs.version.outputs.release == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: npm run verify:release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OrgFlow-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, desktop]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OrgFlow-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          MAC_SIGN: ${{ secrets.CSC_LINK }}
          WIN_SIGN: ${{ secrets.WIN_CSC_LINK }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '$0=="## "v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; fi
          note=""
          if [ "${{ needs.version.outputs.stable }}" != true ]; then note="Release candidate for testing. "; fi
          # The build jobs fail a release with partial credentials, so a
          # platform's signing secret present here means that platform shipped signed.
          if [ -z "${WIN_SIGN:-}" ]; then
            note="${note}The Windows build is not code-signed: in SmartScreen choose **More info → Run anyway**. "
          fi
          if [ -z "${MAC_SIGN:-}" ]; then
            note="${note}The macOS build is not code-signed: right-click OrgFlow.app and choose **Open** the first time; it cannot update itself automatically. "
          fi
          if [ -n "$note" ]; then printf '> %s\n\n' "$note" | cat - release-notes.md > notes.tmp && mv notes.tmp release-notes.md; fi
      # Creates the tag at this commit when it does not exist yet and publishes
      # the release. Pre-release versions (x.y.z-rc.n) never become "latest".
      - name: Publish tagged binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OrgFlow ${{ needs.version.outputs.tag }}${{ needs.version.outputs.stable != 'true' && ' — release candidate' || '' }}
          body_path: release-notes.md
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.version.outputs.stable != 'true' }}
          make_latest: ${{ needs.version.outputs.stable == 'true' }}
