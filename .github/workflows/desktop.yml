name: Desktop binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main or a tag: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  # Decide whether this run publishes a release. A pushed v* tag releases that
  # tag. On main, a package.json version with no matching tag yet releases
  # automatically, so merging a version bump is the whole release procedure.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      stable: ${{ steps.plan.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan release
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; this main build does not release."
            else
              release=true
            fi
          fi
          stable=$([[ "$version" == *-* ]] && echo false || echo true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Release plan: tag=$tag release=$release stable=$stable"
  desktop:
    needs: [quality, version]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            artifact: |
              dist/OrgFlow-*-windows*.exe
              dist/*.blockmap
              dist/latest.yml
              dist/rc.yml
          - name: mac
            os: macos-latest
            script: dist:mac
            artifact: |
              dist/OrgFlow-*-mac.zip
              dist/*.blockmap
              dist/latest-mac.yml
              dist/rc-mac.yml
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            artifact: |
              dist/OrgFlow-*-linux.AppImage
              dist/*.blockmap
              dist/latest-linux.yml
              dist/rc-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Desktop lifecycle test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop lifecycle test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Require signing for stable releases
        if: needs.version.outputs.release == 'true' && needs.version.outputs.stable == 'true' && runner.os != 'Linux'
        shell: bash
        env:
          MAC_SIGN: ${{ secrets.CSC_LINK }}
          WIN_SIGN: ${{ secrets.WIN_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            test -n "$MAC_SIGN" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          else
            test -n "$WIN_SIGN" && test -n "$WIN_PUBLISHER_NAME"
          fi
      - name: Build app and update metadata
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing Actions secrets expand to empty strings. electron-builder
          # treats an empty CSC_LINK as a certificate path, not as unsigned.
          for signing_var in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var}" ]; then unset "$signing_var"; fi
          done
          if [ "${{ runner.os }}" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }}
      - name: Verify shipped signatures and notarization
        if: needs.version.outputs.release == 'true' && needs.version.outputs.stable == 'true' && runner.os != 'Linux'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: npm run verify:release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OrgFlow-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [version, desktop]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OrgFlow-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '$0=="## "v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; fi
          if [ "${{ needs.version.outputs.stable }}" != true ]; then
            printf '> Unsigned release candidate. Windows SmartScreen and macOS Gatekeeper will warn; see the README for how to open it.\n\n' | cat - release-notes.md > notes.tmp && mv notes.tmp release-notes.md
          fi
      # Creates the tag at this commit when it does not exist yet. Release
      # candidates publish immediately; stable releases stay drafts until the
      # signed-update drill in RELEASE_OPERATIONS.md has been recorded.
      - name: Publish tagged binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OrgFlow ${{ needs.version.outputs.tag }}${{ needs.version.outputs.stable != 'true' && ' — unsigned release candidate' || '' }}
          body_path: release-notes.md
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: ${{ needs.version.outputs.stable == 'true' }}
          prerelease: ${{ needs.version.outputs.stable != 'true' }}
          make_latest: ${{ needs.version.outputs.stable == 'true' }}
