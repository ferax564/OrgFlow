name: Desktop binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: quality
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: dist:win
            artifact: |
              dist/OrgFlow-*-windows*.exe
              dist/*.blockmap
              dist/latest.yml
              dist/rc.yml
          - name: mac
            os: macos-latest
            script: dist:mac
            artifact: |
              dist/OrgFlow-*-mac.zip
              dist/*.blockmap
              dist/latest-mac.yml
              dist/rc-mac.yml
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            artifact: |
              dist/OrgFlow-*-linux.AppImage
              dist/*.blockmap
              dist/latest-linux.yml
              dist/rc-linux.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Desktop lifecycle test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Desktop lifecycle test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Require signing for stable releases
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && runner.os != 'Linux'
        shell: bash
        env:
          MAC_SIGN: ${{ secrets.CSC_LINK }}
          WIN_SIGN: ${{ secrets.WIN_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            test -n "$MAC_SIGN" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          else
            test -n "$WIN_SIGN"
          fi
      - name: Build app and update metadata
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing Actions secrets expand to empty strings. electron-builder
          # treats an empty CSC_LINK as a certificate path, not as unsigned.
          for signing_var in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var}" ]; then unset "$signing_var"; fi
          done
          if [ "${{ runner.os }}" = macOS ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run ${{ matrix.script }}
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OrgFlow-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OrgFlow-*
          merge-multiple: true
          path: dist
      - name: Publish tagged binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
