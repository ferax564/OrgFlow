name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Official actions/deploy-pages cannot create a Pages site: GITHUB_TOKEN is
# not allowed to call the Pages enablement API. Publish the static site to
# the gh-pages branch instead; Settings → Pages can then serve that branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble public site
        run: |
          mkdir -p site
          : > site/.nojekyll
          cp -a index.html app.html 404.html robots.txt manifest.webmanifest LICENSE README.md css js assets examples site/
          test -f site/index.html
          test -f site/app.html
          test -f site/js/templates.js
          test -f site/.nojekyll
      - name: Publish gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site init
          git -C site checkout -b gh-pages
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -A
          git -C site commit -m "Publish OrgFlow site"
          # Push through this checkout so we reuse its Actions credentials.
          git fetch "$PWD/site" gh-pages
          git push -f origin FETCH_HEAD:refs/heads/gh-pages
