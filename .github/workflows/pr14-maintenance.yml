name: PR14 implementation verification
on:
  push:
    branches: [ux/planner-backlog]
    paths:
      - .github/workflows/pr14-maintenance.yml
      - scripts/pr14-apply.py
      - scripts/pr14-patch/**
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: pr14-implementation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the checksum-verified source diff
        run: python3 scripts/pr14-apply.py
      - name: Check syntax and lint
        run: |
          mkdir -p /tmp/orgflow-verification
          npm run check 2>&1 | tee /tmp/orgflow-verification/check.log
          npm run lint 2>&1 | tee /tmp/orgflow-verification/lint.log
      - name: Run domain and server tests
        run: npm test 2>&1 | tee /tmp/orgflow-verification/node-tests.log
      - name: Install pinned native browser test runtime
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run native browser regression gate
        run: python tests/browser-regressions.py --browser chromium 2>&1 | tee /tmp/orgflow-verification/browser.log
      - name: Publish verified source to the same PR branch
        run: |
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git config user.name 'OrgFlow maintenance'
            git config user.email 'orgflow-maintenance@users.noreply.github.com'
            git add -A
            git commit -m 'feat: safe persistence, governed scenarios and workforce planning'
            git push origin HEAD:refs/heads/ux/planner-backlog
          fi
      - name: Package exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/orgflow-verification
          git diff --stat > /tmp/orgflow-verification/diff-stat.txt
          git status --short > /tmp/orgflow-verification/status.txt
          tar --exclude=.git --exclude=node_modules --exclude=test-results -czf /tmp/orgflow-verification/orgflow-source.tgz .
          if [ -d test-results/browser ]; then cp -r test-results/browser /tmp/orgflow-verification/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orgflow-implementation-verification
          path: /tmp/orgflow-verification/
          retention-days: 7
