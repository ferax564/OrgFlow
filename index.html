<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrgFlow</title></head>
<body style="margin:0;background:#0b1020;color:#fff;font-family:system-ui"><div id="boot" style="display:grid;place-items:center;height:100vh">Loading OrgFlow…</div>
<script src="chunks/app-1.js"></script><script src="chunks/app-2.js"></script><script src="chunks/app-3.js"></script><script src="chunks/app-4a.js"></script><script src="chunks/app-4b.js"></script><script src="chunks/app-4c.js"></script><script src="chunks/app-4d.js"></script>
<script>
(async()=>{try{const b64=(window.__ORG_CHUNKS||[]).join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='OrgFlow failed to load: '+e.message}})();
</script></body></html>
